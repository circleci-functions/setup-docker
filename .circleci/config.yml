version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  base:
    docker:
      - image: cimg/base:stable
  machine:
    machine:
      image: ubuntu-2404:current
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  smoke:
    description: >-
      Run the packaged acceptance suite on this executor's real PATH, then
      resolve Docker tools by name in a process that sourced nothing.
    parameters:
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    steps:
      - run:
          name: Run smoke test
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_LinksOntoTheRealPath
          environment:
            SETUP_DOCKER_BINARY: ./dist/setup-docker/<< parameters.platform >>/setup-docker<< parameters.ext >>
      - store_test_results:
          path: test-results

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-docker-go-{{ checksum "go.sum" }}-
            - setup-docker-go-
      - run: task lint
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-docker-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-docker into ./dist and persists it to the workspace,
  # so smoke jobs exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-docker-go-{{ checksum "go.sum" }}-
            - setup-docker-go-
      - run: task dry-run
      - run: task build-acceptance build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real downloads and a real task-agent. The suite installs into temp dirs and
  # asserts the tools it put on PATH are the ones it installed.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-docker-go-{{ checksum "go.sum" }}-
            - setup-docker-go-
      - run:
          name: Run acceptance tests
          command: task acceptance
          environment:
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  bare-smoke:
    executor: base
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-machine:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/arm64

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: darwin/arm64

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: windows/amd64
          ext: ".exe"

  remote-docker-smoke:
    executor: base
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: .
      - run:
          name: Install Docker Compose via setup-docker
          command: ./dist/setup-docker/linux/amd64/setup-docker --compose-version v2.29.7
      - run:
          name: Run compose file and assert output
          command: |
            out=$(docker compose -f acceptance/testdata/compose.yml up --abort-on-container-exit 2>&1)
            echo "$out"
            echo "$out" | grep -q "hello from compose"
      - run:
          name: Verify docker-compose version
          command: docker-compose version

  login-smoke:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Start local registry with htpasswd auth
          command: |
            mkdir -p auth
            docker run --rm --entrypoint htpasswd httpd:2 -Bbn testuser testpass > auth/htpasswd
            docker run -d -p 5000:5000 \
              -v "$PWD/auth:/auth" \
              -e REGISTRY_AUTH=htpasswd \
              -e REGISTRY_AUTH_HTPASSWD_REALM=test \
              -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
              registry:2
            # An auth-enabled registry answers 401 once it's up.
            timeout 30 sh -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/v2/)" = 401 ]; do sleep 1; done'
      - run:
          name: Log in to local registry
          command: ./dist/setup-docker/linux/amd64/setup-docker login --registry localhost:5000
          environment:
            DOCKER_LOGIN: testuser
            DOCKER_PASSWORD: testpass
      - run:
          name: Push a test image
          command: |
            docker pull busybox
            docker tag busybox localhost:5000/busybox
            docker push localhost:5000/busybox
      - run:
          name: Wrong password fails and output does not contain it
          command: |
            out=$(DOCKER_LOGIN=testuser DOCKER_PASSWORD=wrongpassword \
              ./dist/setup-docker/linux/amd64/setup-docker login --registry localhost:5000 --retries 1 2>&1 || true)
            echo "$out"
            # must exit non-zero
            DOCKER_LOGIN=testuser DOCKER_PASSWORD=wrongpassword \
              ./dist/setup-docker/linux/amd64/setup-docker login --registry localhost:5000 --retries 1 && exit 1 || true
            # output must not contain the wrong password
            echo "$out" | grep -qv "wrongpassword"
      - run:
          name: Login with credentials-store pass
          command: |
            rm -f ~/.docker/config.json
            REG_USER=testuser REG_PASS=testpass \
              ./dist/setup-docker/linux/amd64/setup-docker login \
                --registry localhost:5000 \
                --username-env REG_USER \
                --password-env REG_PASS \
                --credentials-store
      - run:
          name: Assert credentials-store config and push
          command: |
            store=$(jq -r .credsStore ~/.docker/config.json)
            echo "credsStore: $store"
            [ "$store" = "pass" ]
            inline=$(jq -r '.auths["localhost:5000"].auth // empty' ~/.docker/config.json)
            echo "inline auth: '$inline'"
            [ -z "$inline" ]
            docker push localhost:5000/busybox

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
      - build:
          context: [github-readonly]
      - acceptance:
          context: [github-readonly]
      - bare-smoke:
          requires: [build]
      - smoke-machine:
          requires: [build]
      - smoke-arm:
          requires: [build]
      - smoke-macos:
          requires: [build]
      - smoke-windows:
          requires: [build]
      - remote-docker-smoke:
          requires: [build]
      - login-smoke:
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-docker-go
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - bare-smoke
            - smoke-machine
            - smoke-arm
            - smoke-macos
            - smoke-windows
            - remote-docker-smoke
            - login-smoke
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-docker-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
