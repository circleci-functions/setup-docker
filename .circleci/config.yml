version: 2.1

# Throwaway spike for the build command's assumptions. Never merged.
# Every measurement is printed as a "SPIKE key=value" line.

commands:
  builder:
    parameters:
      opts:
        type: string
        default: ""
    steps:
      - run:
          name: Create a docker-container builder
          command: |
            docker version --format 'SPIKE client={{.Client.Version}} server={{.Server.Version}}'
            echo "SPIKE buildx=$(docker buildx version)"
            s=$(date +%s)
            docker buildx create --name spike --driver docker-container << parameters.opts >> --use --bootstrap
            echo "SPIKE builder_bootstrap_s=$(( $(date +%s) - s ))"

  cached-build:
    parameters:
      label:
        type: string
    steps:
      - run:
          name: Build (<< parameters.label >>) with a local cache
          command: |
            from=""
            if [ -f /tmp/buildx-cache/index.json ]; then from="--cache-from type=local,src=/tmp/buildx-cache"; fi
            s=$(date +%s)
            docker buildx build --progress=plain $from \
              --cache-to type=local,dest=/tmp/buildx-cache-new,mode=max \
              -f spike/Dockerfile spike 2>&1 | tee /tmp/build.log
            echo "SPIKE << parameters.label >>_build_s=$(( $(date +%s) - s ))"
            echo "SPIKE << parameters.label >>_cached_steps=$(grep -c ' CACHED' /tmp/build.log)"
            if grep -q 'built-blob' /tmp/build.log; then r=ran; else r=cached; fi
            echo "SPIKE << parameters.label >>_slow_step=$r"
            echo "SPIKE << parameters.label >>_cache_size=$(du -sh /tmp/buildx-cache-new | cut -f1)"
      - run:
          name: Build (<< parameters.label >>) again with --load
          command: |
            s=$(date +%s)
            docker buildx build --progress=plain --cache-from type=local,src=/tmp/buildx-cache-new \
              --load -t spike:local -f spike/Dockerfile spike > /tmp/load.log 2>&1 || { cat /tmp/load.log; exit 1; }
            echo "SPIKE << parameters.label >>_load_build_s=$(( $(date +%s) - s ))"
            docker run --rm spike:local

  restore-buildx-cache:
    parameters:
      prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - << parameters.prefix >>-{{ .Revision }}-
      - run:
          name: Use the restored cache as the import source
          command: |
            if [ -d /tmp/buildx-cache-new ]; then mv /tmp/buildx-cache-new /tmp/buildx-cache; fi
            echo "SPIKE restored_cache_size=$(du -sh /tmp/buildx-cache 2>/dev/null | cut -f1)"

jobs:
  remote-cold:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - builder
      - cached-build:
          label: remote_cold
      - save_cache:
          key: spike-remote-{{ .Revision }}-{{ .BuildNum }}
          paths:
            - /tmp/buildx-cache-new

  remote-warm:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - restore-buildx-cache:
          prefix: spike-remote
      - builder
      - cached-build:
          label: remote_warm

  machine-cold:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - builder
      - cached-build:
          label: machine_cold
      - save_cache:
          key: spike-machine-{{ .Revision }}-{{ .BuildNum }}
          paths:
            - /tmp/buildx-cache-new

  machine-warm:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - restore-buildx-cache:
          prefix: spike-machine
      - builder
      - cached-build:
          label: machine_warm

  qemu-remote:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Register QEMU on the remote engine
          command: |
            s=$(date +%s)
            docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
            echo "SPIKE qemu_install_s=$(( $(date +%s) - s ))"
      - builder
      - run:
          name: Build and run an arm64 image on amd64
          command: |
            printf 'FROM alpine:3.22\nRUN uname -m > /arch\nCMD ["cat", "/arch"]\n' > /tmp/Dockerfile.arch
            s=$(date +%s)
            docker buildx build --progress=plain --platform linux/arm64 --load -t spike:arm -f /tmp/Dockerfile.arch /tmp
            echo "SPIKE arm64_build_s=$(( $(date +%s) - s ))"
            echo "SPIKE arm64_runs_as=$(docker run --rm --platform linux/arm64 spike:arm)"

  multiarch-machine:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Start a local registry and register QEMU
          command: |
            docker run -d -p 5000:5000 --name registry registry:2
            docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
            printf '[registry."localhost:5000"]\n  http = true\n' > /tmp/buildkitd.toml
      - builder:
          opts: --driver-opt network=host --config /tmp/buildkitd.toml
      - run:
          name: Push multi-arch with and without provenance
          command: |
            printf 'FROM alpine:3.22\nRUN uname -m > /arch\nCMD ["cat", "/arch"]\n' > /tmp/Dockerfile.arch
            for p in clean:--provenance=false default:; do
              tag=${p%%:*}; flag=${p#*:}
              docker buildx build --progress=plain --platform linux/amd64,linux/arm64 $flag --push \
                -t localhost:5000/spike:$tag -f /tmp/Dockerfile.arch /tmp > /tmp/push-$tag.log 2>&1 || { cat /tmp/push-$tag.log; exit 1; }
              entries=$(curl -s -H 'Accept: application/vnd.oci.image.index.v1+json' \
                http://localhost:5000/v2/spike/manifests/$tag | jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | join(",")')
              echo "SPIKE index_$tag=$entries"
            done

  checks:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build check exit codes
          command: |
            echo "SPIKE buildx=$(docker buildx version)"
            for d in check-clean check-warn check-error; do
              code=0; docker buildx build --call=check spike/$d > /tmp/$d.log 2>&1 || code=$?
              echo "SPIKE ${d}_exit=$code"
              sed 's/^/    /' /tmp/$d.log
            done
            code=0; docker buildx build --call=check,format=json spike/check-warn > /tmp/warn.json 2>/dev/null || code=$?
            echo "SPIKE check_warn_json_exit=$code"
            jq -c '[.warnings[]?.ruleName]' /tmp/warn.json | sed 's/^/SPIKE check_warn_rules=/'

workflows:
  spike:
    jobs:
      - remote-cold
      - remote-warm:
          requires: [remote-cold]
      - machine-cold
      - machine-warm:
          requires: [machine-cold]
      - qemu-remote
      - multiarch-machine
      - checks
