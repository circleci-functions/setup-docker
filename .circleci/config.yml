version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  base:
    docker:
      - image: cimg/base:stable
  machine:
    machine:
      image: ubuntu-2404:current
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  smoke:
    description: >-
      Run the packaged acceptance suite on this executor's real PATH, then
      resolve Docker tools by name in a process that sourced nothing.
    parameters:
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
      run:
        type: string
        default: TestAcceptance_LinksOntoTheRealPath|TestAcceptance_Lint
        description: Test name to pass to -test.run.
    steps:
      - run:
          name: Run smoke test
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run '<< parameters.run >>'
          environment:
            SETUP_DOCKER_BINARY: ./dist/setup-docker/<< parameters.platform >>/setup-docker<< parameters.ext >>
      - store_test_results:
          path: test-results

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-docker-go-{{ checksum "go.sum" }}-
            - setup-docker-go-
      - run: task lint
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-docker-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-docker into ./dist and persists it to the workspace,
  # so smoke jobs exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-docker-go-{{ checksum "go.sum" }}-
            - setup-docker-go-
      - run: task dry-run
      - run: task build-acceptance build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real downloads and a real task-agent. The suite installs into temp dirs and
  # asserts the tools it put on PATH are the ones it installed.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-docker-go-{{ checksum "go.sum" }}-
            - setup-docker-go-
      - run:
          name: Run acceptance tests
          command: task acceptance
          environment:
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  bare-smoke:
    executor: base
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-machine:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/arm64

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: darwin/arm64

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: windows/amd64
          ext: ".exe"
          run: TestAcceptance_LinksOntoTheRealPath|TestAcceptance_Lint|TestAcceptance_WindowsClassicBuild

  remote-docker-smoke:
    executor: base
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_ComposeOnRemoteDocker

  login-smoke:
    executor: machine
    environment:
      SETUP_DOCKER_TEST_REGISTRY: localhost:5000
      SETUP_DOCKER_TEST_REGISTRY_USER: testuser
      SETUP_DOCKER_TEST_REGISTRY_PASS: testpass
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Start local registry with htpasswd auth
          command: |
            mkdir -p auth
            docker run --rm --entrypoint htpasswd httpd:2 -Bbn testuser testpass > auth/htpasswd
            docker run -d -p 5000:5000 \
              -v "$PWD/auth:/auth" \
              -e REGISTRY_AUTH=htpasswd \
              -e REGISTRY_AUTH_HTPASSWD_REALM=test \
              -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
              registry:2
            # An auth-enabled registry answers 401 once it's up.
            timeout 30 sh -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/v2/)" = 401 ]; do sleep 1; done'
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_LoginToRegistry

  build-smoke:
    executor: machine
    environment:
      SETUP_DOCKER_TEST_PUSH_REGISTRY: localhost:5000
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Start plain-HTTP registry
          command: |
            docker run -d -p 5000:5000 registry:2
            timeout 30 sh -c 'until curl -sf http://localhost:5000/v2/; do sleep 1; done'
      - smoke:
          platform: linux/amd64
          run: "TestAcceptance_(BuildAndPush|MultiArch|SBOM|Check|Merge)"

  build-remote-smoke:
    executor: base
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_BuildOnRemoteDocker

  build-cache-cold:
    executor: base
    environment:
      SETUP_DOCKER_TEST_CACHE_PHASE: cold
      SETUP_DOCKER_TEST_CACHE_SCOPE: acceptance-<< pipeline.id >>
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_BuildCache

  build-cache-warm:
    executor: base
    environment:
      SETUP_DOCKER_TEST_CACHE_PHASE: warm
      SETUP_DOCKER_TEST_CACHE_SCOPE: acceptance-<< pipeline.id >>
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_BuildCache

  fanout-amd64:
    executor: machine
    environment:
      SETUP_DOCKER_TEST_FANOUT_IMAGE: ttl.sh/setup-docker-acc-<< pipeline.id >>
      SETUP_DOCKER_TEST_FANOUT_PHASE: build
      SETUP_DOCKER_TEST_DIGESTS_DIR: digests
    steps:
      - attach_workspace:
          at: .
      - run: mkdir -p digests
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_FanOut
      - persist_to_workspace:
          root: .
          paths:
            - digests

  fanout-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    environment:
      SETUP_DOCKER_TEST_FANOUT_IMAGE: ttl.sh/setup-docker-acc-<< pipeline.id >>
      SETUP_DOCKER_TEST_FANOUT_PHASE: build
      SETUP_DOCKER_TEST_DIGESTS_DIR: digests
    steps:
      - attach_workspace:
          at: .
      - run: mkdir -p digests
      - smoke:
          platform: linux/arm64
          run: TestAcceptance_FanOut
      - persist_to_workspace:
          root: .
          paths:
            - digests

  fanout-merge:
    docker:
      - image: cimg/base:stable
    environment:
      SETUP_DOCKER_TEST_FANOUT_IMAGE: ttl.sh/setup-docker-acc-<< pipeline.id >>
      SETUP_DOCKER_TEST_FANOUT_PHASE: merge
      SETUP_DOCKER_TEST_DIGESTS_DIR: digests
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64
          run: TestAcceptance_FanOut

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
      - build:
          context: [github-readonly]
      - acceptance:
          context: [github-readonly]
      - bare-smoke:
          requires: [build]
      - smoke-machine:
          requires: [build]
      - smoke-arm:
          requires: [build]
      - smoke-macos:
          requires: [build]
      - smoke-windows:
          requires: [build]
      - remote-docker-smoke:
          requires: [build]
      - login-smoke:
          requires: [build]
      - build-smoke:
          requires: [build]
      - build-remote-smoke:
          requires: [build]
      - build-cache-cold:
          requires: [build]
      - build-cache-warm:
          requires: [build-cache-cold]
      - fanout-amd64:
          requires: [build]
      - fanout-arm64:
          requires: [build]
      - fanout-merge:
          requires: [build, fanout-amd64, fanout-arm64]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-docker-go
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - bare-smoke
            - smoke-machine
            - smoke-arm
            - smoke-macos
            - smoke-windows
            - remote-docker-smoke
            - login-smoke
            - build-smoke
            - build-remote-smoke
            - build-cache-cold
            - build-cache-warm
            - fanout-amd64
            - fanout-arm64
            - fanout-merge
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-docker-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
